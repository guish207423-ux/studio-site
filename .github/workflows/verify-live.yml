name: verify-live
on:
  push:
    branches: [verify/live]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: HTTP probes from GitHub network
        run: |
          set -u
          BASE="https://guish207423-ux.github.io/studio-site"
          echo "== index.html =="
          curl -sS -o /tmp/index.html -D /tmp/index.hdr -w "STATUS=%{http_code} CONTENT_TYPE=%{content_type} BYTES=%{size_download}\n" "$BASE/"
          head -5 /tmp/index.hdr
          echo "== asset refs in fetched HTML =="
          grep -oE '(src|href)="[^"]*assets/[^"]*"' /tmp/index.html || true
          grep -c '"/assets/' /tmp/index.html || echo 'root-absolute /assets count = 0'
          echo "== probe every referenced asset =="
          FAIL=0
          for u in $(grep -oE '/studio-site/assets/[A-Za-z0-9._-]+' /tmp/index.html | sort -u); do
            code=$(curl -sS -o /dev/null -w "%{http_code}|%{content_type}|%{size_download}" "https://guish207423-ux.github.io$u")
            echo "$u -> $code"
            case "$code" in 200\|*) ;; *) FAIL=1 ;; esac
          done
          echo "== lazy chunk probes =="
          for f in About-BzLUhp2z.js Services-BiQSob6Z.js Works-BYjE4z6K.js Process-B-_NpAgR.js Pricing-DQtfFMx0.js Contact-Con28KWK.js CaseStudies-bFe7pJ7g.js Partners-DPdvBOGy.js SectionIcon-BX0AwFl-.js; do
            code=$(curl -sS -o /dev/null -w "%{http_code}|%{content_type}" "$BASE/assets/$f")
            echo "assets/$f -> $code"
            case "$code" in 200\|*) ;; *) FAIL=1 ;; esac
          done
          echo "== static files =="
          for p in /manifest.json /favicon.svg /hyalite.js /robots.txt /sitemap.xml; do
            echo "$p -> $(curl -sS -o /dev/null -w '%{http_code}|%{content_type}' "$BASE$p")"
          done
          echo "== negative control: old root-absolute path (expected 404) =="
          echo "/assets/index-C0_DRvSo.js -> $(curl -sS -o /dev/null -w '%{http_code}' 'https://guish207423-ux.github.io/assets/index-C0_DRvSo.js')"
          echo "FAIL=$FAIL"
          exit $FAIL

      - name: Render in real Chromium (external network, 1440 + 390)
        run: |
          set -u
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1.49.1 --no-audit --no-fund >/dev/null 2>&1
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const URL = 'https://guish207423-ux.github.io/studio-site/';
          const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
          const out = {};
          let fail = false;
          for (const [label, vp] of [['1440', { width: 1440, height: 900 }], ['390', { width: 390, height: 844 }]]) {
            const page = await browser.newPage({ viewport: vp, isMobile: label === '390', hasTouch: label === '390' });
            const failed = [], consoleErrs = [], statuses = [];
            page.on('response', r => statuses.push([r.url().replace('https://guish207423-ux.github.io', ''), r.status(), r.headers()['content-type'] || '']));
            page.on('requestfailed', r => failed.push([r.url(), r.failure()?.errorText]));
            page.on('console', m => { if (m.type() === 'error') consoleErrs.push(m.text().slice(0, 200)); });
            await page.goto(URL, { waitUntil: 'load', timeout: 90000 });
            await page.waitForTimeout(4000);
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
            await page.waitForTimeout(3500);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(1000);
            const metrics = await page.evaluate(() => {
              const cs = getComputedStyle(document.body);
              const overflowX = [...document.querySelectorAll('body *')]
                .filter(el => el.getBoundingClientRect().right > window.innerWidth + 1)
                .map(el => (el.className || el.tagName) + ':' + Math.round(el.getBoundingClientRect().right))
                .slice(0, 8);
              return {
                title: document.title,
                sections: [...document.querySelectorAll('section[id]')].map(s => s.id).length,
                workCards: document.querySelectorAll('.work-card').length,
                glassFloat: document.querySelectorAll('.glass-float').length,
                bodyBg: cs.backgroundColor,
                bodyFont: cs.fontFamily.slice(0, 40),
                h1Color: document.querySelector('h1') ? getComputedStyle(document.querySelector('h1')).color : null,
                navGlass: document.querySelectorAll('.glass-nav').length,
                hyalite: typeof window.Hyalite !== 'undefined',
                rootChildren: document.querySelector('#root')?.children.length ?? 0,
                docWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth,
                viewport: window.innerWidth,
                overflowX,
              };
            });
            await page.screenshot({ path: `live-${label}.png` });
            if (label === '390') {
              await page.evaluate(() => document.querySelector('#works')?.scrollIntoView());
              await page.waitForTimeout(1500);
              await page.screenshot({ path: 'live-390-works.png' });
            }
            const bad = statuses.filter(([, s]) => s >= 400);
            out[label] = { metrics, bad, failed, consoleErrs, resourceCount: statuses.length,
              assetsOk: statuses.filter(([u, s]) => u.includes('/assets/') && s === 200).length };
            if (bad.length || consoleErrs.length) fail = true;
            await page.close();
          }
          console.log(JSON.stringify({ url: URL, ...out }, null, 1));
          await browser.close();
          console.log(fail ? 'VERDICT=FAIL' : 'VERDICT=PASS');
          if (fail) process.exit(1);
          EOF
          node probe.mjs | tee render-result.json
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-verify
          path: |
            render-result.json
            live-1440.png
            live-390.png
            live-390-works.png
            /tmp/index.html
