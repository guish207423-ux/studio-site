name: Deploy to GitHub Pages

on:
  push:
    branches: [master, gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & Build (master only)
        if: github.ref == 'refs/heads/master'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: github.ref == 'refs/heads/master'
        run: npm ci

      - name: Build
        if: github.ref == 'refs/heads/master'
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p ./_deploy
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            cp -r ./dist/* ./_deploy/
          else
            # gh-pages branch: copy everything except .git and .github
            for item in $(ls -A | grep -v '^\.git$' | grep -v '^\.github$' | grep -v '^_deploy$'); do
              cp -r "$item" ./_deploy/
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
