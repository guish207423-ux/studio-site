    <!-- 颜色方案：只有深色。不给 color-scheme 时浏览器会按浅色渲染
         自动表单控件（select / scroll-track），在 #0E0E0E 的表单上变成白底 -->
    <meta name="color-scheme" content="dark" />

    <!-- 统计：defer 不阻塞渲染；offline 排除本地开发，避免把 localhost 流量算进真实数据。
         （原文件里这行是一个没有 src 的空 script —— 注释写着 Plausible，实际什么都没加载，
          等于统计从来没接上。） -->
    <script defer data-domain="shopforyou.online" data-exclude="offline,/**" src="https://plausible.io/js/script.js"></script>

    <!-- 组织 / 站点结构化数据。原先 index.html 里有两份 @type Organization：
         一份 name=屿作所（sameAs: []），一份 name=屿作所 YU STUDIO（含 logo/offers）。
         Google 的富媒体结果取信息更全的那一份，但被同名另一份稀释。
         这里合并成一份，描述与 og:description 保持一致（同一事实两处写会漂移）。 -->

        "offerCount": 6,
        "lowPrice": "15000",
        "highPrice": "80000",
        "priceCurrency": "CNY"
      }
    }
    </script>

           内容必须与 src/components/sections/Hero.tsx、layout/Navigation.tsx 一致；

    <!-- hyalite.js（51KB）原先在这里以普通 <script> 同步加载：它排在 module 图之前，
         浏览器要完整下载+解析这 51KB 之后才能并行发现 /assets/vendor-*.js 等关键 chunk
         （实测首屏多等一整轮）。玻璃接线只需要 window.Hyalite 存在（见 main.tsx 的
         applyHyalite 与 'app:booted' 事件），所以移到 module 之后并加 defer：
         HTML 解析完就并行取所有 chunk，hyalite 仍在 DOMContentLoaded 前到位，语义不变。 -->
    <script defer src="./hyalite.js"></script>
