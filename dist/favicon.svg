  <rect width="24" height="24" rx="6" fill="#050505"/>
  <g fill="none" stroke="#D4FF3F" stroke-width="1.25" stroke-linecap="round">
    <path d="M1.5 12a10.5 10.5 0 1 0 21 0a10.5 10.5 0 1 0-21 0"/>
    <path d="M4.2 12.4a7 7 0 1 0 14 0a7 7 0 1 0-14 0"/>
