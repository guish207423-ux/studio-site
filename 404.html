<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>页面不存在 · 404 — 屿作所 YU STUDIO</title>
    <meta
      name="description"
      content="这一页不存在。回到屿作所首页继续浏览作品、服务与联系方式。"
    />
    <!-- 图标内联成 data URI：不产生请求，也避免浏览器自动去域名根抓 /favicon.ico（子路径部署下必 404）。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230A0A0A'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23A8D93A'/%3E%3C/svg%3E"
    />
    <style>
      /* ==========================================================================
         404 页 — 全内联，零外部资源。
         这条纪律是本页存在的理由：Pages 对任意不存在路径返回 404.html，而
         public/404.html 曾是 index.html 的手抄副本，里面的 /assets/*.css|js 是历史
         构建的 hash；构建产物一变，这一页就 0 条可读 CSS、全白（线上实测）。
         因此本页只用内联 CSS + 系统字体栈，不引用任何 assets/*.js|css|woff2，
         也不需要网络请求就能渲染成与主站一致的深色版式。
         配色取自主站令牌（src/styles/globals.css）：ink #0A0A0A / txt #F0F0F0 /
         txt-2 #B0B0B0 / txt-3 #8A8A8A / accent #A8D93A / line #2E2E2E。
         ========================================================================== */
      :root {
        --ink: #0a0a0a;
        --txt: #f0f0f0;
        --txt-2: #b0b0b0;
        --txt-3: #8a8a8a;
        --accent: #a8d93a;
        --line: #2e2e2e;
        --line-ui: #707070;
        --font-sans: 'PingFang SC', 'HarmonyOS Sans SC', 'Source Han Sans SC',
          'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui,
          -apple-system, 'Segoe UI', sans-serif;
        --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas,
          monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background-color: var(--ink);
        /* 与主站同源的两层背景：右上角荧光晕 + 64px 工程网格（纯 CSS，无图片）。 */
        background-image:
          radial-gradient(
            120% 80% at 78% -10%,
            rgba(168, 217, 58, 0.13),
            rgba(168, 217, 58, 0) 62%
          ),
          linear-gradient(to right, rgba(240, 240, 240, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(240, 240, 240, 0.035) 1px, transparent 1px);
        background-size: auto, 64px 64px, 64px 64px;
        color: var(--txt);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        /* iOS 刘海 / 安卓手势区 */
        padding: clamp(20px, 4vw, 40px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--txt-3);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--txt);
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: none;
      }

      .brand::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(168, 217, 58, 0.55);
      }

      main {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding: clamp(56px, 12vh, 120px) 0;
      }

      .eyebrow {
        margin: 0 0 22px;
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .eyebrow::before {
        content: '';
        display: inline-block;
        width: 28px;
        height: 1px;
        margin-right: 12px;
        vertical-align: middle;
        background: var(--accent);
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(30px, 6vw, 46px);
        line-height: 1.22;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--txt);
        text-wrap: balance;
      }

      .lede {
        margin: 0 0 36px;
        max-width: 46ch;
        font-size: clamp(15px, 1.4vw, 17px);
        color: var(--txt-2);
      }

      .lede code {
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(240, 240, 240, 0.07);
        color: var(--txt);
        font-family: var(--font-mono);
        font-size: 0.9em;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 0 0 40px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .btn--primary {
        background: var(--accent);
        color: #0a0a0a;
      }

      .btn--primary:hover {
        background: #bced4c;
        transform: translateY(-1px);
      }

      /* 幽灵按钮边框走 --line-ui(#707070)：对 #0A0A0A 为 4.0:1，满足 WCAG 1.4.11 的 3:1。 */
      .btn--ghost {
        border-color: var(--line-ui);
        color: var(--txt);
        background: transparent;
      }

      .btn--ghost:hover {
        border-color: var(--txt);
        background: rgba(240, 240, 240, 0.06);
        transform: translateY(-1px);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .path {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 12px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--txt-3);
      }

      .path span {
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .path code {
        color: var(--txt-2);
        word-break: break-all;
      }

      /* 出血的 404 描边字：只做版式重量，不承载信息（aria-hidden），
         z-index: -1 让它压在正文下面、body 背景之上。
         垂直居中靠右：避开头尾两栏的页脚信息（那里有邮箱链接，压字会糊），
         窄屏内容本身已经占满，直接收起。 */
      .watermark {
        position: fixed;
        right: -0.04em;
        top: 50%;
        transform: translateY(-50%);
        z-index: -1;
        margin: 0;
        font-family: var(--font-mono);
        font-size: clamp(220px, 30vw, 460px);
        font-weight: 700;
        line-height: 0.8;
        letter-spacing: -0.05em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(240, 240, 240, 0.11);
        pointer-events: none;
        user-select: none;
      }

      @supports not (-webkit-text-stroke: 1px #000) {
        .watermark {
          color: rgba(240, 240, 240, 0.05);
        }
      }

      @media (max-width: 900px) {
        .watermark {
          display: none;
        }
      }

      footer {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--txt-3);
      }

      footer a {
        color: var(--txt-2);
        text-decoration: none;
        border-bottom: 1px solid var(--line);
      }

      footer a:hover {
        color: var(--txt);
        border-bottom-color: var(--txt-2);
      }

      footer a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        .topbar {
          font-size: 11px;
        }

        .actions .btn {
          flex: 1 1 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }

        .btn:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="watermark" aria-hidden="true">404</p>

    <header class="topbar">
      <span class="brand">屿作所 YU STUDIO</span>
      <span>404 · Not Found</span>
    </header>

    <main>
      <p class="eyebrow">Error 404</p>
      <h1>这一页不存在。</h1>
      <p class="lede">
        链接可能已经改版，或者地址拼错了一位。回到首页继续浏览，也可以直接找我们。
      </p>

      <div class="actions">
        <a class="btn btn--primary" href="/studio-site/">返回首页</a>
        <a class="btn btn--ghost" href="/studio-site/#works">看作品</a>
        <a class="btn btn--ghost" href="/studio-site/#contact">联系我们</a>
      </div>

      <p class="path">
        <span>请求路径</span>
        <code id="req-path">—</code>
      </p>
    </main>

    <footer>
      <span>做界面 · 做前端 · 把设计稿变成能跑的代码</span>
      <span><a href="mailto:3629748383@qq.com">3629748383@qq.com</a></span>
    </footer>

    <script>
      // 唯一用途：把地址栏里真正请求的路径回显出来，方便用户核对是否拼错。
      // 不引任何外部资源，解码失败就原样显示，页面不依赖这段脚本。
      (function () {
        var el = document.getElementById('req-path');
        if (!el) return;
        var path = location.pathname;
        try {
          path = decodeURIComponent(path);
        } catch (err) {
          /* 非法百分号编码时保留原始 pathname */
        }
        el.textContent = path.slice(0, 120);
      })();
    </script>
  </body>
</html>
